[project]
name = "bierkoning"
version = "0.1.0"
description = "Beer stock and cash tracking for a student house"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14,<15",
]

[project.scripts]
bierkoning = "main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# shortcut: modules install top-level (main, db, ...), fine inside uv tool's
# own venv; move them into a bierkoning/ package before publishing to PyPI.
only-include = ["main.py", "db.py", "division.py", "schema.sql"]
